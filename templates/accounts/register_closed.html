{% extends "base.html" %}
{% block title %}Registro cerrado – Nooxial{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center px-4 bg-gray-50">
  <div class="text-center max-w-md">
    <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl">🔒</div>
    <h1 class="text-2xl font-black text-gray-900 mb-2">Registro no disponible</h1>
    <p class="text-gray-500 mb-6">En este momento el registro de nuevos usuarios está desactivado. Si ya tienes una cuenta, puedes iniciar sesión.</p>
    <a href="{% url 'accounts:login' %}"
       class="inline-block bg-gray-900 text-white font-semibold px-8 py-3 rounded-full hover:bg-gray-700 transition-colors">
      Iniciar sesión
    </a>
  </div>
</div>
{% endblock %}
